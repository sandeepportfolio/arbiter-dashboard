# ARBITER — Production Stack
#
# Run with: docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# Differences from docker-compose.yml (dev/sandbox):
#   - arbiter_live database instead of arbiter_dev
#   - Postgres port NOT exposed to host (only reachable over the arbiter_prod_net network)
#   - env_file: .env.production (not .env) — MUST BE PROVISIONED BEFORE first `up`
#   - restart: always on every service (vs unless-stopped) — survives docker-daemon restart
#   - structured json-file log driver with rotation (max-size=50m, max-file=5)
#   - healthcheck-gated startup + healthcheck-gated dependency order
#   - Named volumes: arbiter_postgres_prod_data, arbiter_redis_prod_data
#
# Before first up:
#   1. cp .env.production.template .env.production
#   2. Fill in all <placeholder> values (Kalshi prod key, Polymarket wallet, Telegram, etc.)
#   3. Place keys at ./keys/kalshi_private.pem (mounted read-only into the arbiter container)
#   4. Verify .env.production and ./keys/*.pem are git-ignored (they are by default)
#
# Bring up:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#   curl http://localhost:8080/health   # expect {"status":"ok"} — public probe
#   # Every /api/* route is auth-gated (_auth_middleware). Mint a token first:
#   TOK=$(docker exec arbiter-api-prod python -c \
#     "from arbiter.api import _generate_token; print(_generate_token('$OPS_EMAIL'))")
#   curl -H "Authorization: Bearer $TOK" http://localhost:8080/api/readiness  # expect "ready": true
#
# Tear down (graceful, SAFE-05 shutdown runs):
#   docker compose -f docker-compose.prod.yml down

services:
  # ── Postgres (durable state — NOT exposed to host) ──────────────────
  arbiter-postgres-prod:
    image: postgres:16-alpine
    container_name: arbiter-postgres-prod
    environment:
      POSTGRES_DB: arbiter_live
      POSTGRES_USER: ${PG_USER:-arbiter}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-arbiter_secret}
    volumes:
      - arbiter_postgres_prod_data:/var/lib/postgresql/data
      - ./arbiter/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-arbiter} -d arbiter_live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - arbiter_prod_net

  # ── Redis (quote cache + fanout — NOT exposed to host) ──────────────
  arbiter-redis-prod:
    image: redis:7-alpine
    container_name: arbiter-redis-prod
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - arbiter_redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - arbiter_prod_net

  # ── IB Gateway (ForecastEx persistent TWS socket — IBC-managed login) ─
  # Replaces the IBKR Client Portal Web API gateway (REST, port 5000) whose
  # SSO session expires every few hours. The gnzsnz/ib-gateway image bundles
  # IB Gateway + IBC, keeps itself logged in, and restarts nightly at
  # AUTO_RESTART_TIME to avoid the daily IBKR re-login/2FA prompt.
  #
  # IMPORTANT: this service is OFF in the trading path until IBKR_USE_TWS=true
  # (read by the arbiter container). Until then it just runs alongside; the
  # arbiter API does NOT depend on it, so a gateway login hiccup can never
  # block the live trading API from starting.
  #
  # Port nuance (gnzsnz image): inside the container IB Gateway binds 4001
  # (live) / 4002 (paper) on localhost; the image's socat bridge re-exposes
  # them to other containers on 4003 (live) / 4004 (paper). The arbiter
  # container therefore connects to ib-gateway:4003 for live (see the
  # IBKR_TWS_* overrides on arbiter-api-prod below).
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    container_name: arbiter-ib-gateway-prod
    environment:
      # Credentials — fill IBKR_USERNAME / IBKR_PASSWORD in .env.production.
      # The image expects TWS_USERID / TWS_PASSWORD; we map our placeholder
      # names onto them so .env.production keeps a single naming convention.
      TWS_USERID: ${IBKR_USERNAME}
      TWS_PASSWORD: ${IBKR_PASSWORD}
      # live | paper. Keep in lockstep with IBKR_PAPER_TRADING on the arbiter
      # side (paper -> port 4004, live -> port 4003).
      TRADING_MODE: ${IBKR_TRADING_MODE:-live}
      # Nightly self-restart keeps the session fresh and sidesteps the daily
      # IBKR re-auth window. 23:45 in the gateway's configured timezone.
      AUTO_RESTART_TIME: "23:45"
      TIME_ZONE: ${IBKR_TWS_TIME_ZONE:-America/New_York}
      # If 2FA times out, restart and let IBC retry rather than exiting.
      TWOFA_TIMEOUT_ACTION: restart
      # Keep retrying the login after a 2FA timeout until the operator's
      # weekly IBKR-Mobile tap lands — otherwise a missed tap leaves the bot
      # unauthenticated until someone notices.
      RELOGIN_AFTER_TWOFA_TIMEOUT: "yes"
      # The arbiter places live orders, so the API must be read/write.
      READ_ONLY_API: "no"
      # Suppress the order "precautions" modal so an unattended order is not
      # parked behind a blocking dialog (order-level risk limits still apply).
      BYPASS_WARNING: "yes"
    # TCP liveness on the socat-relayed live API port. Does NOT prove a
    # logged-in session, but catches a dead container / crashed socat. The
    # arbiter does NOT depends_on this service, so an unhealthy gateway never
    # blocks the live API from starting.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/4003' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - arbiter_prod_net

  # ── ARBITER API + Scanner + Engine ──────────────────────────────────
  arbiter-api-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arbiter-api-prod
    image: ghcr.io/sandeepportfolio/arbiter:latest
    env_file: .env.production
    environment:
      # Override the DATABASE_URL so it points at the in-compose Postgres hostname
      # (overrides any localhost value accidentally left in .env.production).
      DATABASE_URL: postgresql://${PG_USER:-arbiter}:${PG_PASSWORD:-arbiter_secret}@arbiter-postgres-prod:5432/arbiter_live
      REDIS_URL: redis://arbiter-redis-prod:6379/0
      # TEMPORARY (2026-07-30): heap tracing for the unresolved ~0.5-1GB/h
      # leak. GET /api/debug/memory returns the top allocation sites; pull a
      # snapshot when RSS is high (docker stats), then REMOVE this line —
      # tracing costs ~5-10% CPU and some memory of its own.
      PYTHONTRACEMALLOC: "4"
      # Use host-side Claude CLI verifier service (Max subscription, no API key needed)
      LLM_VERIFIER_BACKEND: http
      LLM_VERIFIER_HTTP_URL: http://host.docker.internal:8079/verify
      # AUTO_EXECUTE_ENABLED is set in .env.production (loaded via env_file above).
      # Do NOT override it here — `environment:` takes precedence over `env_file:`,
      # which was causing .env.production's value to be silently ignored.
      # AUTO_PROMOTE_ENABLED is set in .env.production (loaded via env_file above).
      # Do NOT override it here — same env_file precedence issue as AUTO_EXECUTE.
      #
      # ForecastEx over the IB Gateway socket: when IBKR_USE_TWS=true (set in
      # .env.production), the arbiter connects to the in-compose ib-gateway
      # service rather than a host gateway. Pin host/port here so they resolve
      # on the Docker network regardless of any localhost value in
      # .env.production. gnzsnz socat ports: 4003=live, 4004=paper — keep this
      # in lockstep with TRADING_MODE / IBKR_PAPER_TRADING.
      IBKR_TWS_HOST: ib-gateway
      IBKR_TWS_PORT: ${IBKR_TWS_PORT:-4003}
    ports:
      - "${ARBITER_PORT:-8080}:8080"
    extra_hosts:
      # ForecastEx: IBKR Client Portal Gateway runs on the host, not in a container.
      # Docker Desktop on macOS auto-resolves host.docker.internal, but declaring it
      # explicitly makes the compose file portable to Linux hosts.
      - "host.docker.internal:host-gateway"
    depends_on:
      arbiter-postgres-prod:
        condition: service_healthy
      arbiter-redis-prod:
        condition: service_healthy
    volumes:
      # RSA private key mounted read-only
      - ./keys:/app/keys:ro
      # Persist operator runtime settings (dashboard toggles). This file
      # overrides env defaults at runtime; keep AUTO_DISCOVERY_ENABLED in
      # .env.production as boot intent, and this mount as durable operator state.
      - ./.arbiter-runtime:/root/.arbiter
      # Claude Code CLI verifier service runs on the host (port 8079)
      # No need to mount auth config — the service handles Claude CLI auth natively
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health').read()\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    # Cap the API's memory. Without a limit this container grew unbounded
    # (~1.9 GiB after 2h) until the KERNEL OOM-killer fired VM-wide, which can
    # take down arbiter-postgres-prod/redis alongside it and reports
    # OOMKilled=false (global OOM, not cgroup OOM) so it looks like a clean
    # exit. A cgroup limit contains the blast radius to this container, makes
    # the kill observable, and lets `restart: always` recover it.
    # NOTE: this bounds the damage, it does not fix the underlying growth.
    mem_limit: 2560m
    memswap_limit: 2560m       # no swap spill — fail fast rather than thrash
    stop_grace_period: 35s   # covers the 5s trip_kill budget + 30s cleanup
    stop_signal: SIGTERM      # triggers arbiter.main SAFE-05 graceful-shutdown
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"
    networks:
      - arbiter_prod_net
    command: ["python", "-m", "arbiter.main", "--live"]

networks:
  arbiter_prod_net:
    driver: bridge
    name: arbiter_prod_net

volumes:
  arbiter_postgres_prod_data:
    name: arbiter_postgres_prod_data
  arbiter_redis_prod_data:
    name: arbiter_redis_prod_data
